<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estimate your Odoo project | Digital Economics</title>

<style>
:root{--blue:#095d82;--green:#459d70;--ink:#183548;--muted:#58707d;--line:#dbe5e9;--bg:#f3f7f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,Arial,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:22px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
button,input,textarea,a.btn{font:inherit}
button,a.btn{cursor:pointer;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--blue);text-decoration:none;display:inline-flex;align-items:center}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled{opacity:.5;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:18px}.brand img:first-child{width:120px}.brand img:last-child{width:64px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.2;margin:18px 0 6px}h2{font-size:20px;margin:24px 0 4px}h3{font-size:15px;margin:18px 0 8px;color:var(--blue)}
.sub{color:var(--muted);margin:0 0 10px}.steps{display:flex;gap:6px;margin:16px 0 6px}.steps span{flex:1;height:5px;border-radius:4px;background:var(--line)}.steps span.on{background:var(--green)}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.pack{display:block;text-align:start;border-width:2px;color:var(--ink);width:100%;padding:14px;min-height:0}.pack[aria-pressed=true]{border-color:var(--green);background:#e9f3ef}.ph{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:17px}.tick{color:var(--green);font-weight:700}.icons{display:flex;flex-wrap:wrap;gap:6px 14px}.ap{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.ap img{width:22px;height:22px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mod{display:flex;align-items:center;gap:10px;text-align:start;border-width:2px;color:var(--ink);width:100%}.mod img{width:28px;height:28px;flex:none}
.mod[aria-pressed=true]{border-color:var(--green);background:#e9f3ef}.mod .tick{margin-inline-start:auto;color:var(--green);font-weight:700}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row small{display:block;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0;min-width:64px;justify-content:center}.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.check input{width:22px;height:22px;flex:none;margin-top:3px}.check small{display:block;color:var(--muted)}
input[type=number]{min-height:44px;width:120px;padding:8px 10px;border:1px solid #b8cbd5;border-radius:8px}
textarea{width:100%;min-height:100px;padding:10px;border:1px solid #b8cbd5;border-radius:8px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.big{background:#edf5f8;border-radius:14px;padding:22px;margin:16px 0}.big b{display:block;font-size:clamp(26px,6vw,38px);color:var(--blue);line-height:1.25;direction:ltr;unicode-bidi:isolate}
.note{background:#fff5df;border-inline-start:4px solid #c58b23;padding:12px 16px;border-radius:6px;margin:14px 0;color:#5d3f0c;font-size:14px}.ok{background:#e9f3ef;border-inline-start:4px solid var(--green);padding:12px 16px;border-radius:6px;margin:14px 0;font-size:14px}
table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:end;white-space:nowrap}td span{display:inline-flex;align-items:center;gap:8px}td img{width:20px;height:20px}
.foot{color:var(--muted);font-size:13px;margin-top:20px}.err{color:#9d2525}
.hide{display:none!important}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
@media(max-width:600px){.wrap{padding:12px}.card{padding:16px}.mods{grid-template-columns:1fr}.seg button{min-width:54px;padding:8px 10px}}
@media print{body{background:#fff}.wrap{padding:0}.card{border:0;padding:0}button,a.btn,.steps,.noprint{display:none!important}}
</style>
</head>
